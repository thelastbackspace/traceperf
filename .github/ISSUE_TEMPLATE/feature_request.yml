name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to measure or find out?
      description: Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like traceperf to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
