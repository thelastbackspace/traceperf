name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Lint, unit tests, package checks and docs on the current LTS.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npm run build:all
    - run: npm run lint
    - name: Type-check sources and tests
      run: npm run typecheck
    - run: npm test
    - name: Package lint (publint + are-the-types-wrong)
      run: npm run lint:package
    - name: Install the tarball into fresh CJS/ESM/TypeScript/bundler projects
      run: npm run verify:package
    - name: Run every documented example and compare its output
      run: npm run verify:docs
    - name: Overhead and bundle-size budgets
      run: npm run bench:check
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist

  # Unit tests on every Node version the dev tooling supports.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build:all
    - run: npm test

  # The published package on every Node version in "engines" (no dev tooling).
  runtime:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: node scripts/verify-package.js --runtime

  # Browser builds in real Chromium, Firefox and WebKit.
  browser:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - run: npx playwright install --with-deps chromium firefox webkit
    - run: npm run test:browser

  # Bun and Deno run the ESM build (nesting, stats, exporters, browser entry).
  other-runtimes:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - uses: oven-sh/setup-bun@v2
    - run: bun test/runtimes/smoke.mjs
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
    - run: deno run --allow-read --allow-env --allow-sys test/runtimes/smoke.mjs

  publish-npm:
    needs: [build, test, runtime, browser, other-runtimes]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'
      - run: npm ci
      - run: npm run build:all
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
