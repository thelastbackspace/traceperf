name: CI

on:
  push:
    branches: [ main ]
    # Pushing a tag like v1.2.3 runs every job and then publishes to npm
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Lint, unit tests, package checks and docs on the current LTS.
  build:
    runs-on: ubuntu-latest
    services:
      # Real databases for the driver instrumentation tests
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: traceperf
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U traceperf" --health-interval 2s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: traceperf
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TRACEPERF_PG_URL: postgres://traceperf@127.0.0.1:5432/traceperf
      TRACEPERF_MONGO_URL: mongodb://127.0.0.1:27017
      TRACEPERF_MYSQL_URL: mysql://root@127.0.0.1:3306/traceperf
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npm run build:all
    - run: npm run lint
    - name: Type-check sources and tests
      run: npm run typecheck
    - run: npm test
    - name: Score traceperf run on 20 apps (planted problems found, no false alarms)
      run: npm run eval
    - name: Package lint (publint + are-the-types-wrong)
      run: npm run lint:package
    - name: Install the tarball into fresh CJS/ESM/TypeScript/bundler projects
      run: npm run verify:package
    - name: Run every documented example and compare its output
      run: npm run verify:docs
    - name: Overhead and bundle-size budgets
      run: npm run bench:check
    - name: API reference builds without warnings
      run: npm run docs:api
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist

  # Unit tests on every Node version the dev tooling supports.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build:all
    - run: npm test

  # The published package on every Node version in "engines" (no dev tooling).
  runtime:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: node scripts/verify-package.js --runtime

  # Browser builds in real Chromium, Firefox and WebKit.
  # Playwright's image has the browsers and their system libraries: no apt
  # step (the runner's apt mirror stalled for 15+ minutes more than once).
  # Keep the tag equal to the installed @playwright/test version.
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
    - uses: actions/checkout@v4
    - run: npm ci
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - run: npm run test:browser

  # Old and new majors of every instrumented driver against real servers:
  # a driver release that moves a patched method fails here, not silently.
  driver-compat:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: traceperf
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U traceperf" --health-interval 2s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: traceperf
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # The legacy mysql driver cannot log in to MySQL 8 (caching_sha2_password);
      # it is used with MariaDB / MySQL 5.7, so test it there
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: traceperf
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TRACEPERF_PG_URL: postgres://traceperf@127.0.0.1:5432/traceperf
      TRACEPERF_MONGO_URL: mongodb://127.0.0.1:27017
      TRACEPERF_MYSQL_URL: mysql://root@127.0.0.1:3306/traceperf
      TRACEPERF_REDIS_URL: redis://127.0.0.1:6379
      TRACEPERF_MARIADB_URL: mysql://root@127.0.0.1:3307/traceperf
      TRACEPERF_COMPAT_STRICT: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - run: npm ci
      working-directory: test/compat
    - run: node compat.js
      working-directory: test/compat

  # The GitHub Action in action.yml, run against a local build: the batched
  # app must pass its baseline, the N+1 version of it must fail.
  action:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - id: same
      uses: ./
      with:
        run: examples/slow-apps/clean-batched/server.js --path /orders -n 30
        baseline: examples/slow-apps/clean-batched/perf-baseline.json
        version: ./
        comment: 'false'
    - id: nplus1
      uses: ./
      with:
        run: examples/slow-apps/n-plus-one/server.js --path /orders -n 30
        baseline: examples/slow-apps/clean-batched/perf-baseline.json
        version: ./
        comment: 'false'
        fail: 'false'
    - name: The batched app passed and the N+1 one was caught
      run: |
        test "${{ steps.same.outputs.regressed }}" = false
        test "${{ steps.nplus1.outputs.regressed }}" = true

  # Bun and Deno run the ESM build (nesting, stats, exporters, browser entry).
  other-runtimes:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - uses: oven-sh/setup-bun@v2
    - run: bun test/runtimes/smoke.mjs
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
    - run: deno run --allow-read --allow-env --allow-sys test/runtimes/smoke.mjs
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - name: Vercel Edge runtime (edge-runtime VM)
      run: node test/runtimes/edge.test.js
    - name: Cloudflare Workers (workerd)
      run: test/runtimes/workerd.sh

  publish-npm:
    needs: [build, test, runtime, browser, driver-compat, action, other-runtimes]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'
      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1
          fi
      - run: npm ci
      - run: npm run build:all
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
